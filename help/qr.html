<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stuck? Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@700&display=swap">
<style>
/* 2026-10-23 BMTC 최종 테스트·시험 때 프로젝터에 띄우는 한 장 — 안내 페이지(help/) QR 둘 */
:root{--ground:#FFFFFF;--ink:#16201E;--soft:#4F5B59;--accent:#1F6F5C;--line:#DBE2E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#FFFFFF;--ink:#16201E;--soft:#4F5B59}}
:root[data-theme="dark"]{--ground:#FFFFFF;--ink:#16201E}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Noto Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
h1{font-family:"Noto Serif",Georgia,serif;font-size:clamp(28px,5vw,60px);margin:0 0 6px;text-align:center}
.sub{font-size:clamp(16px,2.4vw,28px);color:var(--soft);margin:0 0 20px;text-align:center}
.row{display:flex;gap:clamp(16px,5vw,80px);flex-wrap:wrap;justify-content:center}
figure{margin:0;text-align:center}
figure img{width:min(40vw,44vh,420px);max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px}
.steps{margin:22px 0 0;font-size:clamp(16px,2.4vw,30px);line-height:1.5;max-width:1100px}
.steps b{color:var(--accent)}
.url{margin-top:14px;font-size:clamp(14px,1.8vw,22px);color:var(--soft);word-break:break-all;text-align:center}
</style>
</head>
<body>
  <h1>Stuck? · Umekwama?</h1>
  <p class="sub">Leave your screen as it is.</p>
  <div class="row">
    <figure><img src="qr-en.png" alt="QR — guide in English"></figure>
    <figure><img src="qr-sw.png" alt="QR — guide in Kiswahili"></figure>
  </div>
  <div class="steps">
    <div><b>1</b> Your paper card for that step — on your table</div>
    <div><b>2</b> Scan → <i>One seminar, start to finish</i> · <i>Common problems</i></div>
    <div><b>3</b> Ask the person next to you — they point, you tap</div>
  </div>
  <div class="url">claude-artifacts-livid.vercel.app/help/</div>
</body>
</html>
