<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Ministry Manager Guide</title>
<!-- 2026-10-24 태남 「허브는 안쓴다니까. 뭐하러 2군데 만들어」 → 사용 안내는 Ministry Manager 가이드북(/help) 하나.
     이미 나간 QR·링크(?lang= · #student · #map · #coord)가 끊기지 않게 맞는 책으로 넘긴다. 옛 안내 = mmv2 태그 bmtc26-final -->
<script>
(function () {
  var MM = 'https://ministry.beekorea.org/help';
  var book = { student: '/student', map: '/facilitator', coord: '/coordinator' }[location.hash.slice(1)] || '';
  var lang = new URLSearchParams(location.search).get('lang');
  location.replace(MM + book + (lang === 'en' || lang === 'ko' ? '?lang=' + lang : ''));
})();
</script>
</head><body style="font-family:'Noto Sans',sans-serif;padding:24px">
<p><a href="https://ministry.beekorea.org/help">Ministry Manager Guide → ministry.beekorea.org/help</a></p>
